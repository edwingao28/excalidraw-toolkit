name: Release

# Publishes to npm when a version tag (v*) is pushed. Authentication uses npm
# trusted publishing (OIDC): no npm token is stored in this repository.
# One-time setup and the release steps are in docs/releasing.md.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
      - run: npm install --global npm@12.0.2

      - name: Check the tag matches package.json and is on main
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-canvas-fonts.mjs --install-browser

      # prepublishOnly runs the syntax checks and the test suite; prepack rebuilds
      # the distributable and checks the packed preview. Provenance is automatic.
      - run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
